services:
  # ---- Express API ----
  - type: web
    name: buildora-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @buildora/api... build
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Render sets PORT itself; the app already reads it via env.PORT.
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: https://buildora-web.onrender.com
      # SSLCommerz sends the payer back to the API, which redirects into the web
      # app — both URLs have to be known.
      - key: WEB_BASE_URL
        value: https://buildora-web.onrender.com
      - key: API_BASE_URL
        value: https://buildora-api.onrender.com
      # Store credentials stay out of git; set them in the Render dashboard.
      # Leave SSLCZ_SANDBOX true until you hold live merchant credentials.
      - key: SSLCZ_SANDBOX
        value: "true"
      - key: SSLCZ_STORE_ID
        sync: false
      - key: SSLCZ_STORE_PASSWORD
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  # ---- Next.js web app ----
  - type: web
    name: buildora-web
    runtime: node
    plan: free
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @buildora/web... build
    startCommand: pnpm --filter @buildora/web start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://buildora-api.onrender.com
